name: Patch result conversion UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply result UX and analytics patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # 후보 카드를 세로형으로 바꾸고 게이지가 카드 전체 폭을 사용하도록 합니다.
          s=re.sub(r'\.partner-card\{([^}]*)display:flex;([^}]*)\}', lambda m: '.partner-card{'+m.group(1)+'display:block;'+m.group(2)+'}', s, count=1)
          if '.partner-card>span{display:block;width:100%}' not in s:
              s=s.replace('.partner-card strong{font-size:14px}', '.partner-card>span{display:block;width:100%}.partner-card strong{font-size:14px}')
          s=s.replace('.partner-match{margin-top:10px}', '.partner-match{width:100%;margin-top:10px}')
          # 결과 화면에서 핵심 추천 카드가 후보 비교보다 먼저 보이도록 순서를 정리합니다.
          anchor='button:focus-visible,a:focus-visible,summary:focus-visible'
          order_css='#result.is-visible{display:flex;flex-direction:column}#result .result-head{order:1}#result .recommend-box{order:2}#result .reason{order:3}#result .result-confidence{order:4}#result .other-partners{order:5}#result .notice{order:6}#result .result-trust{order:7}#result .restart{order:8}#result .tip{order:9}'
          if order_css not in s:
              s=s.replace(anchor, order_css+anchor, 1)
          # 결과 문구를 내부 매칭 기준으로 명확히 바꿉니다.
          s=s.replace('장기렌트·리스 조건도<br>함께 비교해보세요.', '선택한 조건에서 먼저<br>확인할 상담 경로입니다.')
          s=s.replace('선택한 답변을 기준으로 차량을 바로 구매하기 전에<br>다른 이용 방법의 조건도 확인해볼 만해요.', '선택한 답변을 기준으로 내부 매칭 기준을 적용해<br>먼저 비교할 상담 경로를 정리했습니다.')
          s=s.replace('가장 추천하는 상담', '조건에 따른 우선 상담 경로')
          s=s.replace('내 조건과의 내부 추천 점수', '내 조건과의 내부 매칭 점수')
          s=s.replace('카픽 퀴즈에서 선택한 조건을 업체별 기준으로 비교해 계산한 내부 추천 점수입니다.', '카픽 퀴즈에서 선택한 조건을 업체별 기준으로 비교해 계산한 내부 매칭 점수입니다. 실제 승인 가능성을 의미하지 않습니다.')
          s=s.replace('추천 점수', '조건 일치도')
          s=s.replace('<details class="other-partners">', '<details class="other-partners" open>')
          # 기존 dataLayer 이벤트를 유지하면서 GA4가 연결될 경우 같은 이벤트를 전달할 수 있게 합니다.
          old="function track(name,params){window.dataLayer=window.dataLayer||[];window.dataLayer.push(Object.assign({event:name},params||{}));}"
          new="function track(name,params){window.dataLayer=window.dataLayer||[];const payload=Object.assign({event:name},params||{});window.dataLayer.push(payload);if(typeof window.gtag==='function'){window.gtag('event',name,params||{});}}"
          s=s.replace(old,new)
          # 첫 답변과 각 질문 답변을 분석 이벤트로 남깁니다.
          marker="button.addEventListener('click',function(){"
          inject="button.addEventListener('click',function(){if(step===1&&!questions[0].dataset.started){questions[0].dataset.started='1';track('quiz_start');}track('question_answer',{question:step,answer:Number(button.dataset.score)});"
          if 'track(\'question_answer\'' not in s:
              s=s.replace(marker, inject, 1)
          # 추천 CTA, 후보 CTA, 가이드 클릭도 구분해서 기록합니다.
          oldcta="if(recommendCta)recommendCta.addEventListener('click',function(){track('recommend_cta_click');});"
          newcta="if(recommendCta)recommendCta.addEventListener('click',function(){track('recommend_cta_click',{provider:document.getElementById('recommendTitle').textContent});});document.addEventListener('click',function(e){const card=e.target.closest('.partner-card');if(card){const name=card.querySelector('strong');track('partner_click',{provider:name?name.textContent.trim():''});}const guide=e.target.closest('.guide-grid a');if(guide){track('guide_click',{guide:guide.textContent.trim()});}});"
          s=s.replace(oldcta,newcta)
          p.write_text(s,encoding='utf-8')
          q=Path('privacy.html')
          q.write_text(q.read_text(encoding='utf-8').replace('← 카픽코리아','카픽코리아'),encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=['조건에 따른 우선 상담 경로','조건 일치도','quiz_start','question_answer','partner_click','guide_click','display:block','width:100%;margin-top:10px','other-partners" open']
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing: '+', '.join(missing))
          if '←' in Path('privacy.html').read_text(encoding='utf-8'): raise SystemExit('privacy arrow remains')
          print('validation passed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html privacy.html
          git diff --cached --check
          git commit -m 'Patch result conversion UX and analytics hooks'
          git push
