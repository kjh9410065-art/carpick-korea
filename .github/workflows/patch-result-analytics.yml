name: Patch result conversion UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Patch result conversion UX and analytics hooks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply result UX and analytics patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            '.partner-card{padding:16px 18px;border:1px solid #e8e6f4;border-radius:18px;background:#fff;color:#222;display:flex;justify-content:space-between;gap:10px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}':'.partner-card{padding:16px 18px;border:1px solid #e8e6f4;border-radius:18px;background:#fff;color:#222;display:block;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.partner-card>span{display:block;width:100%}',
            '.partner-match{margin-top:10px}.partner-match-top':'.partner-match{width:100%;margin-top:10px}.partner-match-top',
            '#result{display:none;max-width:900px;margin:28px auto 0}#result.is-visible{display:block}': '#result{display:none;max-width:900px;margin:28px auto 0}#result.is-visible{display:flex;flex-direction:column}#result .result-head{order:1}#result .recommend-box{order:2}#result .reason{order:3}#result .result-confidence{order:4}#result .other-partners{order:5}#result .notice{order:6}#result .result-trust{order:7}#result .restart{order:8}#result .tip{order:9}',
            '#result.is-visible{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 20px;padding-top:35px}': '#result.is-visible{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 20px;padding-top:35px}',
            '<h2>장기렌트·리스 조건도<br>함께 비교해보세요.</h2>':'<h2>선택한 조건에서 먼저<br>확인할 상담 경로입니다.</h2>',
            '<p>선택한 답변을 기준으로 차량을 바로 구매하기 전에<br>다른 이용 방법의 조건도 확인해볼 만해요.</p>':'<p>선택한 답변을 기준으로 내부 매칭 기준을 적용해<br>먼저 비교할 상담 경로를 정리했습니다.</p>',
            '<div class="recommend-label">가장 추천하는 상담</div>':'<div class="recommend-label">조건에 따른 우선 상담 경로</div>',
            '내 조건과의 내부 추천 점수':'내 조건과의 내부 매칭 점수',
            '카픽 퀴즈에서 선택한 조건을 업체별 기준으로 비교해 계산한 내부 추천 점수입니다.':'카픽 퀴즈에서 선택한 조건을 업체별 기준으로 비교해 계산한 내부 매칭 점수입니다. 실제 승인 가능성을 의미하지 않습니다.',
            'aria-label="내 조건과의 내부 추천 점수"':'aria-label="내 조건과의 내부 매칭 점수"',
            '<span>추천 점수</span>':'<span>조건 일치도</span>',
            '<details class="other-partners">':'<details class="other-partners" open>',
            "function track(name,params){window.dataLayer=window.dataLayer||[];window.dataLayer.push(Object.assign({event:name},params||{}));}":"function track(name,params){\n    // 모든 주요 행동을 dataLayer에 남기고, GA4가 연결된 경우에도 같은 이벤트를 전달합니다.\n    window.dataLayer=window.dataLayer||[];\n    const payload=Object.assign({event:name},params||{});\n    window.dataLayer.push(payload);\n    if(typeof window.gtag==='function'){window.gtag('event',name,params||{});}\n  }",
            "button.addEventListener('click',function(){\n      const current=questions[step-1];":"button.addEventListener('click',function(){\n      // 첫 선택 시 설문 시작 이벤트를 기록합니다.\n      if(step===1 && !questions[0].dataset.started){questions[0].dataset.started='1';track('quiz_start');}\n      track('question_answer',{question:step,answer:Number(button.dataset.score)});\n      const current=questions[step-1];",
            "if(recommendCta)recommendCta.addEventListener('click',function(){track('recommend_cta_click');});":"if(recommendCta)recommendCta.addEventListener('click',function(){track('recommend_cta_click',{provider:document.getElementById('recommendTitle').textContent});});\n  document.addEventListener('click',function(e){\n    const card=e.target.closest('.partner-card');\n    if(card){const name=card.querySelector('strong');track('partner_click',{provider:name?name.textContent.trim():''});}\n    const guide=e.target.closest('.guide-grid a');\n    if(guide){track('guide_click',{guide:guide.textContent.trim()});}\n  });"
          }
          for a,b in reps.items():
            if a not in s:
              raise SystemExit(f'missing expected pattern: {a[:80]}')
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          q=Path('privacy.html')
          t=q.read_text(encoding='utf-8').replace('← 카픽코리아','카픽코리아')
          q.write_text(t,encoding='utf-8')
          PY
      - name: Validate HTML and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '조건에 따른 우선 상담 경로' in s
          assert '조건 일치도' in s
          assert 'quiz_start' in s and 'question_answer' in s and 'partner_click' in s
          assert 'display:block;transition' in s
          assert 'width:100%;margin-top:10px' in s
          assert '<details class="other-partners" open>' in s
          assert '←' not in Path('privacy.html').read_text(encoding='utf-8')
          print('validation passed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html privacy.html
          git diff --cached --check
          git commit -m 'Patch result conversion UX and analytics hooks'
          git push
