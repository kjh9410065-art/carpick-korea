name: Link New Guides

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  link-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add 0.00.32 guide links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='long-term-rental-cost-guide.html'
          if marker in text:
              print('Guide links already present')
              raise SystemExit(0)
          needle='''<a href="car-lease-guide.html" style="padding:15px 16px;background:#fff;border-radius:16px;text-decoration:none;color:#222;font-weight:700;">자동차 리스 계약 전 확인할 것 →</a></div></section>'''
          addition='''<a href="car-lease-guide.html" style="padding:15px 16px;background:#fff;border-radius:16px;text-decoration:none;color:#222;font-weight:700;">자동차 리스 계약 전 확인할 것 →</a><a href="long-term-rental-cost-guide.html" style="padding:15px 16px;background:#fff;border-radius:16px;text-decoration:none;color:#222;font-weight:700;">장기렌터카 비용 비교할 때 확인할 것 →</a><a href="car-buying-checklist.html" style="padding:15px 16px;background:#fff;border-radius:16px;text-decoration:none;color:#222;font-weight:700;">자동차 구매 전 체크리스트 →</a><a href="lease-contract-checklist.html" style="padding:15px 16px;background:#fff;border-radius:16px;text-decoration:none;color:#222;font-weight:700;">자동차 리스 계약 체크리스트 →</a></div></section>'''
          if needle not in text:
              raise SystemExit('Guide anchor block not found')
          text=text.replace(needle,addition,1)
          css='''\n/* 0.00.32 guide link polish */\n@media (min-width:768px){main section[aria-labelledby="guide-title"]{box-shadow:0 12px 30px rgba(43,35,90,.04)}}\n'''
          end=text.rfind('</style>')
          text=text[:end]+css+text[end:]
          p.write_text(text,encoding='utf-8')
          PY

      - name: Commit generated links
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: link new vehicle guide pages from home'
          git push
