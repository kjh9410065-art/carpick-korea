name: Apply Mingka desktop layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enlarge desktop layout one step
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # 같은 패치가 다시 실행되어 CSS가 중복으로 붙는 것을 막습니다.
          marker = '/* 밍카 PC 화면 한 단계 확대 패치 */'
          if marker in html:
              raise SystemExit('desktop patch already applied')

          # 모바일 스타일은 건드리지 않고 768px 이상에서만 PC 화면을 한 단계 키웁니다.
          patch = '''
          /* 밍카 PC 화면 한 단계 확대 패치 */
          @media (min-width:768px){
            /* PC에서 콘텐츠가 너무 좁게 보이지 않도록 전체 서비스 폭을 조금 넓힙니다. */
            .app{
              width:min(1280px,calc(100vw - 48px));
            }

            /* 첫 화면의 좌우 여백과 두 영역의 크기를 함께 키워 PC에서 여유 있게 보이게 합니다. */
            .top{
              padding:44px 72px 58px;
              grid-template-columns:minmax(0,1fr) 500px;
              column-gap:78px;
            }

            /* 메인 제목은 PC에서 한 단계만 키워 시선이 먼저 잡히도록 합니다. */
            .top h1{
              font-size:62px;
              max-width:680px;
            }

            /* 오른쪽 진단 카드도 화면 크기에 맞춰 조금 넓힙니다. */
            .hero{
              padding:32px;
            }

            /* 본문 최대 폭을 맞춰 아래 콘텐츠도 같은 기준선으로 정렬합니다. */
            main{
              max-width:1280px;
              padding-left:56px;
              padding-right:56px;
            }

            /* 질문 제목과 설명을 한 단계 키워 PC에서 읽기 편하게 합니다. */
            .quiz-title h2{
              font-size:38px;
            }
            .quiz-title p{
              font-size:15px;
            }

            /* 진단 박스의 내부 여백을 조금 늘려 카드가 답답해 보이지 않게 합니다. */
            #quiz{
              padding:38px 40px 46px;
            }

            /* 질문 문구는 모바일과 달리 PC에서 크게 보여도 과하지 않도록 40px로 조정합니다. */
            .question h2{
              font-size:40px;
            }

            /* 선택지는 가로 3열 구조를 유지하면서 높이만 조금 키웁니다. */
            .options{
              gap:18px;
            }
            .option{
              min-height:185px;
              padding:28px 32px 27px 26px;
            }
            .option strong{
              font-size:18px;
            }
            .option span{
              font-size:14px;
            }

            /* 검색용 정보 영역도 메인 폭과 맞춰 PC에서 좌우가 어긋나지 않게 합니다. */
            .seo-intro{
              max-width:1240px;
              padding-left:56px;
              padding-right:56px;
            }
            .trust-strip{
              max-width:1200px;
              padding-left:56px;
              padding-right:56px;
            }
          }
          '''

          # 마지막 </style> 바로 앞에 추가하므로 기존 모바일 CSS와 기능을 건드리지 않습니다.
          if '</style>' not in html:
              raise SystemExit('style closing tag not found')
          html = html.replace('</style>', patch + '\n</style>', 1)
          path.write_text(html, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enlarge Mingka desktop layout one step'
          git push

      - name: Remove temporary patch workflow
        run: |
          git rm .github/workflows/apply-desktop-layout.yml
          git commit -m 'Remove temporary desktop layout patch workflow'
          git push
