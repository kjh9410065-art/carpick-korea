name: Final site review fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  review-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply 0.00.33 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '/* 0.00.33-final-review */'
          if marker not in text:
              # 1) 하단 CTA를 실제 클릭 가능한 링크 카드로 변경한다.
              old = '<section class="bottom-cta" aria-label="차량 이용 방법 비교 안내"><div class="bottom-cta-icon">✦</div><div><strong>어떤 방식이 맞는지 아직 고민된다면</strong><p>몇 가지 질문만으로 현재 조건을 정리하고 비교를 시작해보세요.</p></div><span>30초 체크 →</span></section>'
              new = '<a class="bottom-cta" href="#quiz" aria-label="30초 차량 이용 진단으로 이동"><div class="bottom-cta-icon">✦</div><div><strong>어떤 방식이 맞는지 아직 고민된다면</strong><p>몇 가지 질문만으로 현재 조건을 정리하고 비교를 시작해보세요.</p></div><span>30초 체크 →</span></a>'
              if old not in text:
                  raise SystemExit('bottom CTA block not found')
              text = text.replace(old, new, 1)

              # 2) 결과에서 다시 시작할 때 남아 있던 inline display:none이 다음 결과를 가리는 버그를 제거한다.
              text = text.replace("result.style.display='none';quiz.style.display='block';showStep();quiz.scrollIntoView({behavior:'smooth',block:'start'})", "result.style.display='';quiz.style.display='block';showStep();quiz.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(updateFloating,50)", 1)

              # 3) 결과 화면 진입 시 부동 CTA가 결과 위를 덮지 않도록 숨기고, 브라우저 기본 전체 스크롤 대신 결과 요소로 이동한다.
              text = text.replace("showRecommendation();quiz.style.display='none';result.classList.add('is-visible');window.scrollTo({top:result.offsetTop-20,behavior:'smooth'})", "showRecommendation();quiz.style.display='none';result.classList.add('is-visible');floating.classList.remove('show');result.scrollIntoView({behavior:'smooth',block:'start'})", 1)

              # 4) 하단 CTA의 텍스트가 배경 위에서 확실히 읽히도록 대비와 배치를 고정한다.
              css = r'''
          
          /* 0.00.33-final-review: 하단 CTA 가독성·클릭성 및 결과 재시작 버그 수정 */
          .bottom-cta{color:#fff;cursor:pointer;position:relative;z-index:1}
          .bottom-cta strong,.bottom-cta p,.bottom-cta>span{position:relative;z-index:1}
          .bottom-cta strong{color:#fff}
          .bottom-cta p{color:rgba(255,255,255,.78)!important}
          .bottom-cta>span{color:#fff}
          .bottom-cta:hover{color:#fff}
          @media (max-width:767px){
            .bottom-cta{min-height:72px}
            .bottom-cta>span{font-size:11px;letter-spacing:-.3px}
          }
          @media (min-width:768px){
            .bottom-cta{min-height:86px}
          }
          '''
              end = text.rfind('</style>')
              if end < 0:
                  raise SystemExit('</style> not found')
              text = text[:end] + css + marker + '\n' + text[end:]
              index.write_text(text, encoding='utf-8')

          # 5) 새로 만든 가이드 3개도 사이트맵에 포함한다.
          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          urls = [
              'https://carpick-korea.carpick.workers.dev/long-term-rental-cost-guide.html',
              'https://carpick-korea.carpick.workers.dev/car-buying-checklist.html',
              'https://carpick-korea.carpick.workers.dev/lease-contract-checklist.html',
          ]
          additions = []
          for url in urls:
              if url not in sm:
                  additions.append(f'<url><loc>{url}</loc><lastmod>2026-09-08</lastmod><changefreq>monthly</changefreq><priority>0.75</priority></url>')
          if additions:
              sm = sm.replace('</urlset>', ''.join(additions) + '</urlset>')
              sitemap.write_text(sm, encoding='utf-8')

          # 일회성 워크플로 파일 자체를 제거하여 이후 push 때 반복 실행되지 않게 한다.
          workflow = Path('.github/workflows/final-review.yml')
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit final review fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml .github/workflows/final-review.yml
          git commit -m 'fix: complete final UI and SEO review'
          git push
