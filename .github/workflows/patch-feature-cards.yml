name: Patch feature cards
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message != 'Patch feature cards mobile layout'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update feature cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MINGKA_FEATURE_CARDS_V1 */'
          if marker not in s:
              css = '''\n/* MINGKA_FEATURE_CARDS_V1 */\n/* 모바일에서 01, 02, 03 카드를 가로형 정보 카드로 바꿔 숫자는 왼쪽에 두고 제목과 설명은 더 크게 보여줍니다. */\n@media (max-width:767px){\n  .trust-strip{grid-template-columns:1fr;gap:10px}\n  .trust-strip>div{padding:16px 18px;text-align:left}\n  .trust-strip span{display:inline-block;margin:0 8px 0 0;font-size:12px}\n  .trust-strip strong{display:inline;font-size:16px}\n  .trust-strip small{margin-top:5px;font-size:12px}\n}\n'''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Patch feature cards mobile layout'
          git push
