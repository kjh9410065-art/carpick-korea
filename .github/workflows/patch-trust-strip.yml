name: Patch trust strip layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Patch trust strip layout')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update mobile trust cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '.trust-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 24px 16px}.trust-strip>div{padding:13px 9px;border:1px solid #eeeaf5;border-radius:16px;background:#faf9ff;text-align:center;font-size:12px;font-weight:800}.trust-strip span{display:block;color:#7567e8;font-size:11px;margin-bottom:3px}.trust-strip strong{display:block}.trust-strip small{display:block;margin-top:4px;color:#888;font-size:10px;font-weight:500;line-height:1.4}'
          new = '.trust-strip{display:grid;grid-template-columns:1fr;gap:12px;padding:0 24px 16px}.trust-strip>div{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:auto auto;align-items:center;padding:18px 20px;border:1px solid #eeeaf5;border-radius:18px;background:#faf9ff;text-align:left}.trust-strip span{grid-column:1;grid-row:1 / 3;display:flex;align-items:center;color:#7567e8;font-size:24px;font-weight:900;line-height:1;margin:0}.trust-strip strong{grid-column:2;grid-row:1;display:block;font-size:18px;line-height:1.35}.trust-strip small{grid-column:2;grid-row:2;display:block;margin-top:5px;color:#888;font-size:13px;font-weight:500;line-height:1.5}'

          if old not in s:
              raise SystemExit('target CSS not found; refusing to modify index.html')
          s = s.replace(old, new, 1)

          marker = '</style>'
          extra = '''\n/* 작은 화면에서도 01, 02, 03 카드의 숫자와 설명이 또렷하게 보이도록 조정합니다. */\n@media (min-width:768px){\n  .trust-strip{grid-template-columns:repeat(3,1fr)}\n  .trust-strip>div{display:block;text-align:center;padding:13px 9px}\n  .trust-strip span{display:block;font-size:11px;margin-bottom:3px}\n  .trust-strip strong{font-size:12px}\n  .trust-strip small{font-size:10px;margin-top:4px}\n}\n'''
          if extra.strip() not in s:
              s = s.replace(marker, extra + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'grid-template-columns:52px minmax(0,1fr)',
              'font-size:24px',
              'font-size:18px',
              '작은 화면에서도 01, 02, 03 카드',
              'G-06DTYM04S2',
              'MINGKA_TRAFFIC_TRACKING_V1'
          ]
          for x in checks:
              assert x in s, x
          assert s.count('<html') == 1 and s.count('</html>') == 1
          print('validation passed')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Patch trust strip layout'
          git push
