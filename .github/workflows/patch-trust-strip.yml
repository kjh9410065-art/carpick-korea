name: Improve trust strip
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update trust strip desktop layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '</style>'
          patch = '''
/* 데스크톱의 서비스 특징 카드는 숫자를 왼쪽에 배치하고 설명 글씨를 키워 한눈에 읽기 쉽게 만듭니다. */
@media (min-width:768px){
  .trust-strip>div{
    display:grid;
    grid-template-columns:76px 1fr;
    grid-template-rows:auto auto;
    align-items:center;
    column-gap:18px;
    padding:22px 24px;
    text-align:left;
  }
  .trust-strip span{
    grid-row:1 / 3;
    align-self:center;
    margin:0;
    font-size:30px;
    line-height:1;
    letter-spacing:-1px;
  }
  .trust-strip strong{
    font-size:21px;
    line-height:1.35;
    letter-spacing:-.8px;
  }
  .trust-strip small{
    margin-top:4px;
    font-size:13px;
    line-height:1.5;
  }
}
'''
          if '데스크톱의 서비스 특징 카드는 숫자를 왼쪽에 배치' in html:
              raise SystemExit('patch already applied')
          if marker not in html:
              raise SystemExit('style closing tag not found')
          html = html.replace(marker, patch + marker, 1)
          path.write_text(html, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve desktop trust strip readability'
          git push
