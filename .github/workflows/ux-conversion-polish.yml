name: Apply conversion UX polish
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply UX polish
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 결과 영역에서 추천 이유와 CTA 사이의 행동 유도 문구를 강화합니다.
          marker = '<div class="recommend-box">'
          insert = '''<div class="result-confidence">\n  <strong>상담 전에 확인해보세요</strong>\n  <span>진단 결과는 참고용이며 실제 조건과 상담 내용은 차량·이용 조건에 따라 달라질 수 있습니다.</span>\n</div>\n'''
          if marker in s and 'result-confidence' not in s:
              s = s.replace(marker, insert + marker, 1)

          # 결과 화면에서 추천 결과 → 설명 → 상담 CTA 흐름이 자연스럽게 보이도록 스타일을 추가합니다.
          style_marker = '.recommend-box{margin-top:14px;'
          css = '''.result-confidence{margin-top:14px;padding:14px 16px;border:1px solid #ebe8f3;border-radius:16px;background:#faf9fc;color:#777;font-size:11px;line-height:1.55}.result-confidence strong{display:block;margin-bottom:4px;color:#5f5a68;font-size:12px}.result-confidence span{display:block}\n'''
          if style_marker in s and 'result-confidence{' not in s:
              s = s.replace(style_marker, css + style_marker, 1)

          # 모바일 CTA를 화면에서 쉽게 누를 수 있도록 최소 높이를 보장합니다.
          s = s.replace('.cta{display:block;margin-top:15px;', '.cta{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:15px;', 1)

          # 모바일 결과 영역에서도 추가된 신뢰 문구가 충분한 여백을 갖도록 합니다.
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: improve result CTA confidence"
          git push origin main
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/ux-conversion-polish.yml
          git add .github/workflows/ux-conversion-polish.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time UX workflow"
            git push origin main
          fi
