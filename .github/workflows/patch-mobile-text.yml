name: Patch mobile text readability

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-text.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mobile typography
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MINGKA_MOBILE_READABILITY_V1 */'
          if marker not in s:
              s += '''\n<style>\n/* MINGKA_MOBILE_READABILITY_V1 */\n/* 모바일에서 본문과 안내 문구가 너무 작아 보이지 않도록 글자 크기만 조정합니다. */\n@media (max-width:767px){\n  .top p{font-size:15px;line-height:1.7}\n  .seo-intro p{font-size:15px;line-height:1.85}\n  .trust-strip>div{font-size:12px}\n  .trust-strip small{font-size:11px;line-height:1.5}\n  .quiz-title p{font-size:14px;line-height:1.6}\n  .question h2{font-size:24px;line-height:1.4}\n  .question .desc{font-size:13px;line-height:1.7}\n  .option{min-height:82px;padding:18px 24px 18px 18px}\n  .option strong{font-size:16px;line-height:1.45}\n  .option span{font-size:13px;line-height:1.55}\n  .result-head h2{font-size:25px;line-height:1.4}\n  .result-head p,.recommend-box p,.reason div,.result-confidence{font-size:13px;line-height:1.75}\n  .recommend-box h3{font-size:22px;line-height:1.4}\n  .match-note{font-size:12px!important;line-height:1.6!important}\n  .seo-info>p,.seo-grid p,.guide p,.faq-section>p{font-size:14px;line-height:1.8}\n  .seo-grid h3,.guide-grid a{font-size:14px}\n  .faq-item summary{font-size:14px;line-height:1.55}\n  .faq-item p{font-size:14px;line-height:1.8}\n}\n</style>\n'''
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -q 'MINGKA_MOBILE_READABILITY_V1' index.html
          grep -q '@media (max-width:767px)' index.html
          grep -q 'G-06DTYM04S2' index.html
          grep -q 'MINGKA_TRAFFIC_TRACKING_V1' index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          HTMLParser().feed(Path('index.html').read_text(encoding='utf-8'))
          print('index.html validation passed')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Improve mobile text readability'
            git push
          fi
