name: Patch feature copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Patch feature copy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Change feature cards to numbered one-line copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # 기존 3개 특징 카드의 HTML만 정확히 찾아 사용자가 원하는
          # "1. 제목 - 설명" 형태로 바꿉니다. 다른 영역의 내용은 건드리지 않습니다.
          old = '<div class="trust-strip" aria-label="서비스 특징"><div><span>01</span><strong>간단한 질문</strong><small>복잡한 조건 대신 핵심 기준부터</small></div><div><span>02</span><strong>조건 비교</strong><small>선택한 답변을 기준으로 정리</small></div><div><span>03</span><strong>상담 경로</strong><small>조건에 맞는 제휴 경로 확인</small></div></div>'

          new = '<div class="trust-strip" aria-label="서비스 특징"><div><strong>1. 간단한 질문 - 복잡한 조건 대신 핵심 기준부터</strong></div><div><strong>2. 조건 비교 - 선택한 답변을 기준으로 정리</strong></div><div><strong>3. 상담 경로 - 조건에 맞는 제휴 경로 확인</strong></div></div>'

          if old not in html:
              raise SystemExit('target feature card markup not found')

          html = html.replace(old, new, 1)

          # 기존 span/small용 CSS는 남아 있어도 동작에는 문제가 없지만,
          # 새 한 줄형 카드가 더 깔끔하게 보이도록 PC/모바일 공통 스타일을 마지막에 덧씌웁니다.
          css = '''
          /* 서비스 특징을 "번호. 제목 - 설명" 한 줄형으로 보여주는 패치 */
          .trust-strip>div{
            text-align:left;
          }
          .trust-strip>div strong{
            display:block;
            color:#292733;
            font-size:13px;
            line-height:1.55;
            letter-spacing:-.35px;
          }
          @media (min-width:768px){
            .trust-strip>div{
              padding:18px 20px;
            }
            .trust-strip>div strong{
              font-size:15px;
              line-height:1.5;
            }
          }
          @media (max-width:767px){
            .trust-strip{
              grid-template-columns:1fr;
            }
            .trust-strip>div{
              padding:15px 16px;
            }
            .trust-strip>div strong{
              font-size:13px;
            }
          }
          '''

          marker = '/* MINGKA_FEATURE_COPY_V1 */'
          if marker not in html:
              css = '\n' + marker + '\n' + css
              html = html.replace('</style>', css + '</style>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Patch feature copy'
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-feature-copy.yml
          git commit -m 'Remove temporary feature copy workflow'
          git push
