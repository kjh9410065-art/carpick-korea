name: Final polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final UX, analytics hooks and policy links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='/* 0.00.34-final-polish */'
          if marker in t:
              raise SystemExit(0)

          # 1) OG image 메타 태그 추가
          t=t.replace('<meta property="og:site_name" content="카픽코리아">','<meta property="og:site_name" content="카픽코리아">\n<meta property="og:image" content="https://carpick-korea.carpick.workers.dev/og-image.svg">',1)

          # 2) 질문 카드에 이전 버튼을 추가하고 현재 질문 이동을 관리한다.
          t=t.replace('<div class="progress-line"><span id="progressText" aria-live="polite">1 / 4</span><span>약 30초</span></div>','<div class="progress-line"><span id="progressText" aria-live="polite">1 / 4</span><span>약 30초</span></div><button id="prevQuestion" class="prev-question" type="button" hidden>← 이전 질문</button>',1)

          # 3) footer를 정책 링크가 있는 형태로 확장한다.
          old='<footer>카픽 CAR PICK<br>제휴 링크를 통해 상담이 진행될 수 있습니다.</footer>'
          new='<footer>카픽 CAR PICK<br>제휴 링크를 통해 상담이 진행될 수 있습니다.<div class="footer-links"><a href="privacy.html">개인정보 처리 안내</a><a href="terms.html">서비스 이용 안내</a><a href="affiliate.html">제휴 및 상담 연결 안내</a></div></footer>'
          t=t.replace(old,new,1)

          css=r'''
          /* 0.00.34-final-polish */
          .prev-question{margin-top:16px;border:0;background:transparent;color:#7567e8;font-size:12px;font-weight:900;cursor:pointer;padding:7px 0}
          .prev-question:hover{text-decoration:underline}
          .footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:12px}
          .footer-links a{color:#8e8996;font-size:10px;font-weight:700;text-decoration:underline;text-underline-offset:2px}
          .policy-note{margin-top:10px;color:#999;font-size:10px;line-height:1.6}
          @media (min-width:768px){.prev-question{font-size:13px;margin-top:18px}.footer-links{gap:20px}.footer-links a{font-size:11px}}
          '''
          end=t.rfind('</style>')
          t=t[:end]+css+'\n'+t[end:]

          # 4) 이전 질문 로직 + 퀴즈/CTA 이벤트 훅 추가
          t=t.replace("const questions=document.querySelectorAll('.question'),bar=document.getElementById('bar'),progressText=document.getElementById('progressText'),quiz=document.getElementById('quiz'),result=document.getElementById('result');", "const questions=document.querySelectorAll('.question'),bar=document.getElementById('bar'),progressText=document.getElementById('progressText'),quiz=document.getElementById('quiz'),result=document.getElementById('result'),prevQuestion=document.getElementById('prevQuestion');\nfunction track(name,params={}){window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:name,...params})}",1)
          t=t.replace("function showStep(){questions.forEach(q=>q.classList.remove('active'));document.querySelector(`[data-step=\\\"${step}\\\"]`).classList.add('active');bar.style.width=`${(step/questions.length)*100}%`;progressText.textContent=`${step} / ${questions.length}`}", "function showStep(){questions.forEach(q=>q.classList.remove('active'));document.querySelector(`[data-step=\\\"${step}\\\"]`).classList.add('active');bar.style.width=`${(step/questions.length)*100}%`;progressText.textContent=`${step} / ${questions.length}`;prevQuestion.hidden=step===1}",1)
          t=t.replace("document.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll(`[data-step=\\\"${step}\\\"] .option`).forEach(btn=>btn.classList.remove('selected'));button.classList.add('selected');if(step<questions.length){step++;showStep()}else{showRecommendation();quiz.style.display='none';result.classList.add('is-visible');floating.classList.remove('show');result.scrollIntoView({behavior:'smooth',block:'start'})}}));", "document.querySelectorAll('.option').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll(`[data-step=\\\"${step}\\\"] .option`).forEach(btn=>btn.classList.remove('selected'));button.classList.add('selected');track('quiz_answer',{step,score:Number(button.dataset.score)});if(step<questions.length){step++;showStep()}else{showRecommendation();track('quiz_complete');quiz.style.display='none';result.classList.add('is-visible');floating.classList.remove('show');result.scrollIntoView({behavior:'smooth',block:'start'})}}));",1)
          t=t.replace("document.getElementById('restart').addEventListener('click',()=>{step=1;score=0;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));result.classList.remove('is-visible');result.style.display='none';quiz.style.display='block';showStep();quiz.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(updateFloating,50)});", "document.getElementById('restart').addEventListener('click',()=>{track('quiz_restart');step=1;score=0;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));result.classList.remove('is-visible');result.style.display='';quiz.style.display='block';showStep();quiz.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(updateFloating,50)});",1)

          # 이전 버튼 이벤트 추가
          needle="window.addEventListener('scroll',updateFloating,{passive:true});"
          add="prevQuestion.addEventListener('click',()=>{if(step<=1)return;step--;const current=document.querySelector(`[data-step=\\\"${step+1}\\\"] .option.selected`);if(current)current.classList.remove('selected');showStep();track('quiz_back',{step});});\nwindow.addEventListener('scroll',updateFloating,{passive:true});"
          t=t.replace(needle,add,1)

          # 상담 CTA 클릭 이벤트
          t=t.replace("const floating=document.getElementById('floatingQuizCta');", "document.getElementById('recommendCta').addEventListener('click',()=>track('recommend_cta_click'));\ntrack('page_ready');\nconst floating=document.getElementById('floatingQuizCta');",1)

          p.write_text(t,encoding='utf-8')

          # 사이트맵에 정책/OG 관련 HTML 페이지 추가
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          urls=[
            'https://carpick-korea.carpick.workers.dev/privacy.html',
            'https://carpick-korea.carpick.workers.dev/terms.html',
            'https://carpick-korea.carpick.workers.dev/affiliate.html'
          ]
          additions=[]
          for u in urls:
            if u not in sm:
              additions.append(f'<url><loc>{u}</loc><lastmod>2026-09-08</lastmod><changefreq>monthly</changefreq><priority>0.5</priority></url>')
          if additions:
            sm=sm.replace('</urlset>',''.join(additions)+'</urlset>')
            Path('sitemap.xml').write_text(sm,encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/final-polish.yml
          git add index.html sitemap.xml .github/workflows/final-polish.yml
          git commit -m 'feat: add final UX polish, policy links and analytics hooks'
          git push
