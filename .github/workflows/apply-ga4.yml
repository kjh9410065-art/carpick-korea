name: Apply GA4 patch

on:
  push:
    paths:
      - '.github/workflows/apply-ga4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good Mingka index
        run: git checkout 2cc0d855d5c793c58dab6230868a4afd7d512326 -- index.html

      - name: Add GA4 tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '''<!-- Google Analytics 4: 밍카 사이트 방문 및 주요 행동을 측정합니다. -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-06DTYM04S2"></script>
          <script>
            // GA4가 사용할 dataLayer를 먼저 준비합니다.
            window.dataLayer = window.dataLayer || [];
            // Google 태그가 전달받은 데이터를 dataLayer에 넣도록 정의합니다.
            function gtag(){dataLayer.push(arguments);}
            // 태그 로딩 시각을 기록합니다.
            gtag('js', new Date());
            // 밍카의 GA4 측정 ID를 연결합니다.
            gtag('config', 'G-06DTYM04S2');
          </script>\n'''
          marker = '<style>'
          if 'G-06DTYM04S2' not in s:
              s = s.replace(marker, tag + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          grep -q 'G-06DTYM04S2' index.html
          grep -q 'og-image-mingka.svg' index.html
          grep -q '밍카' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Connect GA4 to Mingka' || exit 0
          git push
