name: Remove emoji UI
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace emoji UI with non-emoji vector UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          car = '<svg viewBox="0 0 64 64" aria-hidden="true" width="38" height="38"><path d="M12 39h40v10H12zM17 39l5-14h20l5 14M18 49v5M46 49v5M18 35h28" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="46" r="3" fill="currentColor"/><circle cx="43" cy="46" r="3" fill="currentColor"/></svg>'
          result_car = '<svg viewBox="0 0 64 64" aria-hidden="true" width="38" height="38"><path d="M10 39h44v10H10zM16 39l6-15h20l6 15M17 49v5M47 49v5" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="46" r="3" fill="currentColor"/><circle cx="44" cy="46" r="3" fill="currentColor"/></svg>'
          s = s.replace('<div class="car-icon">🚗</div>', '<div class="car-icon">' + car + '</div>')
          s = s.replace('<div class="result-icon">🚘</div>', '<div class="result-icon">' + result_car + '</div>')
          s = s.replace('<div class="recommend-label">🎯 가장 추천하는 상담</div>', '<div class="recommend-label">가장 추천하는 상담</div>')
          s = s.replace('<strong>💡 참고</strong>', '<strong>참고</strong>')
          s = s.replace('<div class="bottom-cta-icon">✦</div>', '<div class="bottom-cta-icon">CHECK</div>')
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: remove emoji UI icons"
          git push origin main
          rm -f .github/workflows/remove-emoji-ui.yml
          git add .github/workflows/remove-emoji-ui.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time emoji cleanup workflow"
            git push origin main
          fi
