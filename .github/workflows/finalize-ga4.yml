name: Finalize GA4 patch

on:
  push:
    paths:
      - '.github/workflows/finalize-ga4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore latest known-good Mingka index
        run: |
          git fetch origin e7f2aa2c87ccec6c18edfaaad4f19d308c9bdc46 --depth=1
          git show e7f2aa2c87ccec6c18edfaaad4f19d308c9bdc46:index.html > index.html
      - name: Add GA4 tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='''<!-- Google Analytics 4: 밍카 사이트 방문 및 주요 행동을 측정합니다. -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-06DTYM04S2"></script>
          <script>
            // GA4가 사용할 dataLayer를 먼저 준비합니다.
            window.dataLayer = window.dataLayer || [];
            // Google 태그가 전달받은 데이터를 dataLayer에 넣도록 정의합니다.
            function gtag(){dataLayer.push(arguments);}
            // 태그 로딩 시각을 기록합니다.
            gtag('js', new Date());
            // 밍카의 GA4 측정 ID를 연결합니다.
            gtag('config', 'G-06DTYM04S2');
          </script>\n'''
          if 'G-06DTYM04S2' not in s:
              s=s.replace('<style>',tag+'<style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          grep -q 'G-06DTYM04S2' index.html
          grep -q 'og-image-mingka.svg?v=20260908-2' index.html
          grep -q '밍카' index.html
          grep -q 'partner-match' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Connect GA4 to Mingka' || exit 0
          git push
