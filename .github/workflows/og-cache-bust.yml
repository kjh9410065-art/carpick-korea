name: Bust OG preview cache

on:
  push:
    paths:
      - '.github/workflows/og-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add OG cache-busting query
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://carpick-korea.carpick.workers.dev/og-image-mingka.svg', 'https://carpick-korea.carpick.workers.dev/og-image-mingka.svg?v=20260908-2')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust cached Mingka OG preview' || exit 0
          git push
