name: Fix responsive UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-responsive-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply responsive UI fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = "/* responsive-ui-fixed-2026-09 */"

          if marker in text:
              print("Responsive UI fix already applied.")
              raise SystemExit(0)

          # 작은 데스크톱 창에서도 모바일 레이아웃으로 급격히 전환되지 않게 한다.
          text = text.replace("@media(max-width:980px)", "@media(max-width:767px)")
          text = text.replace("@media (min-width:981px)", "@media (min-width:768px)")
          text = text.replace("@media(min-width:981px)", "@media(min-width:768px)")
          text = text.replace("980px 이하에서는 기존 모바일 구조로 자연스럽게 돌아간다.", "767px 이하에서만 모바일 구조로 전환한다.")

          # PC용 .app 영역은 최소 980px을 유지해 UI 자체가 작아지지 않게 한다.
          if "min-width:980px;" not in text:
              pattern = r'(\.app\{)(max-width:1320px;)'
              text, count = re.subn(pattern, r'\1min-width:980px;\2', text, count=1)
              if count != 1:
                  raise SystemExit("Desktop .app rule was not found.")

          # 데스크톱 창이 좁아지면 페이지가 가로 스크롤되며 UI 크기는 유지한다.
          match = re.search(r'body\{[^}]*\}', text)
          if not match:
              raise SystemExit("body rule was not found.")
          body_rule = match.group(0)
          if "overflow-x:auto" not in body_rule:
              new_body_rule = body_rule[:-1] + ";overflow-x:auto}"
              text = text[:match.start()] + new_body_rule + text[match.end():]

          # 중복 실행을 막기 위한 완료 마커.
          text = text.replace("</style>", f"{marker}\n</style>", 1)
          path.write_text(text, encoding="utf-8")
          print("Responsive UI fix applied.")
          PY

      - name: Commit the fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: keep desktop UI size when window narrows"
          git push