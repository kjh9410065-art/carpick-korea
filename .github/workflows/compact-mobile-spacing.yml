name: Compact mobile spacing

on:
  push:
    paths:
      - '.github/workflows/compact-mobile-spacing.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compact mobile layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* MINGKA_MOBILE_SPACING_V1 */'
          if marker not in s:
              patch='''\n<style>\n/* MINGKA_MOBILE_SPACING_V1\n   모바일에서 콘텐츠 사이의 과도한 공백을 줄이고 한 화면에 더 많은 정보가 자연스럽게 보이도록 조정합니다.\n   글자 크기를 무리하게 키우지 않고 간격과 카드 높이를 중심으로 압축합니다. */\n@media (max-width:767px){\n  .seo-intro{padding:22px 24px 14px}\n  .seo-intro h2{margin-bottom:8px}\n  .seo-intro p{font-size:14px;line-height:1.7}\n  .trust-strip{gap:8px;padding:0 24px 10px}\n  .trust-strip>div{padding:10px 7px;border-radius:14px}\n  .trust-strip span{margin-bottom:2px}\n  .trust-strip strong{font-size:12px}\n  .trust-strip small{margin-top:2px;font-size:9px;line-height:1.3}\n  main{padding:18px 16px}\n  .quiz-title{margin-bottom:12px}\n  .quiz-title h2{font-size:24px}\n  .quiz-title p{font-size:13px}\n  #quiz{margin-top:12px;padding:20px 16px 22px;border-width:2px;border-radius:22px}\n  #quiz:before{margin-bottom:10px;padding:6px 10px}\n  .question{padding-top:18px}\n  .question h2{font-size:23px;line-height:1.35}\n  .question .desc{margin:7px 0 14px;font-size:12px;line-height:1.6}\n  .option{min-height:68px;padding:15px 26px 15px 16px;border-radius:15px}\n  .option strong{font-size:15px}\n  .option span{font-size:12px;line-height:1.45}\n  .options{gap:8px}\n  .seo-info{margin-top:26px;padding-top:22px}\n  .guide{margin-top:22px;padding:18px}\n  .faq-section{margin-top:26px;padding:22px}\n}\n</style>\n'''
              s=s.replace('</body>', patch+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        run: |
          test -s index.html
          grep -q 'MINGKA_MOBILE_SPACING_V1' index.html
          grep -q 'G-06DTYM04S2' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('<html')==1 and s.count('</html>')==1
          assert s.count('<body')==1 and s.count('</body>')==1
          print('validation ok')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Compact mobile spacing'
          git push
