name: Patch 029
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply result UX patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='.partner-match{margin-top:10px}.partner-match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:10px;color:#888}.partner-match-top strong{font-size:14px;color:#7567e8}.partner-match-track{height:7px;background:#eceaf4;border-radius:99px;overflow:hidden}.partner-match-fill{height:100%;background:linear-gradient(90deg,#9b80eb,#7567e8);border-radius:99px;transition:width .5s ease}'
          marker='button:focus-visible,a:focus-visible,summary:focus-visible{'
          if '.partner-match{' not in s:
              s=s.replace(marker,css+'\n'+marker,1)
          old="result.scrollIntoView({behavior:'smooth',block:'start'});"
          new="requestAnimationFrame(function(){const top=result.getBoundingClientRect().top+window.scrollY-18;window.scrollTo({top:top,behavior:'smooth'});});"
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: improve result focus and partner gauges'
          git push
