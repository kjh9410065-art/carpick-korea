name: Patch mobile result visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix mobile result visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '#result{display:none;max-width:900px;margin:28px auto 0}'
          new = '#result{display:none;max-width:900px;margin:28px auto 0}#result.is-visible{display:block}'
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-mobile-result.yml

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/patch-mobile-result.yml
          git commit -m 'fix: show quiz result on mobile'
          git push
