name: Adjust feature card text layout

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Patch feature layout' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep existing card design and change text position
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = '''<div class="trust-strip" aria-label="서비스 특징">
            <div><span>01</span><strong>간단한 질문</strong><small>복잡한 조건 대신 핵심 기준부터</small></div>
            <div><span>02</span><strong>조건 비교</strong><small>선택한 답변을 기준으로 정리</small></div>
            <div><span>03</span><strong>상담 경로</strong><small>조건에 맞는 제휴 경로 확인</small></div>
          </div>'''

          new = '''<div class="trust-strip" aria-label="서비스 특징">
            <div><span>01</span><strong>간단한 질문</strong><small>- 복잡한 조건 대신 핵심 기준부터</small></div>
            <div><span>02</span><strong>조건 비교</strong><small>- 선택한 답변을 기준으로 정리</small></div>
            <div><span>03</span><strong>상담 경로</strong><small>- 조건에 맞는 제휴 경로 확인</small></div>
          </div>'''

          if old not in html:
              raise SystemExit('Expected feature card markup was not found.')

          html = html.replace(old, new, 1)

          marker = '/* MINGKA_FEATURE_LAYOUT_V1 */'
          css = '''
/* MINGKA_FEATURE_LAYOUT_V1 */
/* 기존 특징 카드의 배경, 테두리, 모서리 등 디자인은 유지하고 텍스트의 위치만 한 줄 흐름으로 정리합니다. */
.trust-strip>div{
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
}
.trust-strip span{
  flex:0 0 auto;
  margin:0;
}
.trust-strip strong{
  flex:0 0 auto;
  display:inline;
  font-size:18px;
  line-height:1.35;
}
.trust-strip small{
  flex:1 1 auto;
  display:inline;
  margin:0;
  font-size:13px;
  line-height:1.5;
}
@media (max-width:767px){
  /* 모바일에서도 기존 카드 디자인을 유지하면서 번호·제목·설명을 같은 흐름에 배치합니다. */
  .trust-strip>div{
    display:flex;
    align-items:center;
    gap:8px;
    padding:18px 18px;
  }
  .trust-strip span{font-size:22px;}
  .trust-strip strong{font-size:16px;}
  .trust-strip small{font-size:13px;}
}
'''

          if marker not in html:
              html = html.replace('</style>', css + '\n</style>', 1)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Patch feature layout"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/patch-feature-layout.yml
          git add .github/workflows/patch-feature-layout.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary feature layout workflow"
          git push
